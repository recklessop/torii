# bandit configuration for the CI security scan (#82).
#
# Two test IDs are skipped project-wide, each for a structural reason rather
# than to hide a finding:
#
#   B608 (SQL injection via string-built queries) — torii talks to Postgres
#   exclusively through asyncpg, which uses $1/$2 bind parameters, never value
#   interpolation. The f-strings bandit flags in rbac.py and audit.py compose
#   only column names, placeholder tokens ($N), and int-coerced intervals — no
#   caller-controlled value is ever formatted into SQL text. bandit cannot see
#   the parameter boundary, so every dynamic query trips it.
#
#   B104 (binding to all interfaces) — the process binds 0.0.0.0 by design: it
#   runs in a container and is reached only through the reverse proxy / tunnel
#   in front of it (see SECURITY.md). Binding a single interface inside the
#   container namespace buys nothing.
#
# Everything else stays on. Keep this list minimal; prefer a targeted fix over
# a new skip.
skips:
  - B104
  - B608
