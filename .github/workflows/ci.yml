name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: torii
          POSTGRES_PASSWORD: torii
          POSTGRES_DB: torii
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TORII_TEST_DATABASE_URL: postgresql://torii:torii@localhost:5432/torii
      # The OAuth HTTP tests TRUNCATE, so they run against a separate DB and
      # leave the rollback-isolated schema/RBAC tests undisturbed. Created
      # automatically by the test harness.
      TORII_OAUTH_TEST_DATABASE_URL: postgresql://torii:torii@localhost:5432/torii_oauth
      DATABASE_URL: postgresql://torii:torii@localhost:5432/torii_oauth
      VALKEY_URL: redis://localhost:6379/0
      PUBLIC_BASE_URL: https://torii.test
      # A missing test DB must fail the build, not silently skip the spec.
      TORII_REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # `python -m pytest` (not the console script) so the repo root is on
      # sys.path and `torii` imports.
      - name: Run tests
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit
      # Medium+ severity; bandit.yaml documents the structural skips.
      - name: bandit
        run: bandit -r torii -c bandit.yaml -ll
      # Non-blocking: a newly-published CVE shouldn't turn main red with no code
      # change to fix it, but it still surfaces in the log.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.lock --strict --desc
      - name: gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-git --verbose
